name: Update subscription

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch subscription
        run: |
          curl -sL -A "v2raytun/android" "https://freeinternet.bot/n0WQuU-4c2yRgWwL" -o sub.txt

      - name: Commit and push
        run: |
          git config user.name "c4elovek-cmd"
          git config user.email "c4elovek-cmd@users.noreply.github.com"
          git add sub.txt
          if git diff --cached --quiet; then
            echo "No changes, nothing to commit"
            exit 0
          fi
          git commit -m "Update subscription $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push